  --gold:#F5B800;--gold-dim:rgba(245,184,0,.12);--gold-b:rgba(245,184,0,.28);
  --txt:#E8EAF0;--txt-dim:#6B7280;--green:#22C55E;--red:#EF4444;--accent:#F5B800;}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}
.app{display:flex;flex-direction:column;height:100dvh;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);
  padding:env(safe-area-inset-top,12px) 16px 12px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.topbar-info{flex:1;}
.topbar-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;}
.topbar-sub{font-size:10px;color:var(--txt-dim);margin-top:1px;}
.topbar-user{font-size:10px;font-weight:700;color:var(--gold);background:var(--gold-dim);
  padding:4px 10px;border-radius:20px;border:1px solid var(--gold-b);white-space:nowrap;}
.btn-icon{background:none;border:none;color:var(--txt-dim);cursor:pointer;font-size:20px;padding:4px;}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.bottom-nav{background:var(--surface);border-top:1px solid var(--border);
  display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;
  padding:8px 4px 6px;cursor:pointer;color:var(--txt-dim);font-size:9px;
  font-weight:700;letter-spacing:.03em;gap:3px;border:none;background:none;transition:color .15s;}
.nav-item i{font-size:20px;}
.nav-item.active{color:var(--accent);}
.col-tabs{display:flex;overflow-x:auto;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0;scrollbar-width:none;}
.col-tabs::-webkit-scrollbar{display:none;}
.col-tab{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;
  cursor:pointer;border:1px solid var(--border);color:var(--txt-dim);background:transparent;
  transition:all .15s;white-space:nowrap;}
.col-tab.active{background:var(--accent);color:#111;border-color:var(--accent);}
.search-bar{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);
  border-radius:10px;margin:10px 12px 0;padding:0 12px;gap:8px;flex-shrink:0;}
.search-bar i{color:var(--txt-dim);font-size:16px;}
.search-bar input{flex:1;background:transparent;border:none;color:var(--txt);font-size:13px;
  padding:10px 0;outline:none;font-family:'DM Sans',sans-serif;}
.cards-area{flex:1;overflow-y:auto;padding:10px 12px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.card-item{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;position:relative;}
.card-item:active{background:var(--card);}
.ci-code{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--accent);margin-bottom:3px;}
.ci-route{font-size:10px;color:var(--txt-dim);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-title{font-size:13px;font-weight:600;margin-bottom:6px;line-height:1.3;}
.ci-meta{display:flex;gap:6px;flex-wrap:wrap;}
.ci-tag{font-size:10px;color:var(--txt-dim);background:var(--card);padding:2px 7px;border-radius:4px;display:flex;align-items:center;gap:3px;}
.ci-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--txt-dim);font-size:16px;}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60%;gap:12px;color:var(--txt-dim);text-align:center;}

/* ── Pull to refresh ── */
.ptr-indicator{
  display:flex;align-items:center;justify-content:center;gap:8px;
  height:0;overflow:hidden;transition:height .2s;
  font-size:12px;color:var(--txt-dim);flex-shrink:0;
  background:var(--bg);
}
.ptr-indicator.visible{height:44px;}
.ptr-indicator .spinner{width:16px;height:16px;border-width:2px;}
.ptr-arrow{font-size:18px;transition:transform .3s;display:inline-block;}
.ptr-arrow.ready{transform:rotate(180deg);}

/* ── Anexos no modal ── */
.attach-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.attach-item{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--border);
  border-radius:9px;padding:10px 12px;
}
.attach-icon{font-size:20px;color:var(--gold);flex-shrink:0;}
.attach-name{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.attach-size{font-size:10px;color:var(--txt-dim);flex-shrink:0;}
.attach-del{background:none;border:none;color:var(--txt-dim);cursor:pointer;font-size:16px;padding:2px 4px;}
.attach-del:active{color:var(--red);}
.btn-attach{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:11px;border-radius:9px;border:1.5px dashed var(--border);
  background:transparent;color:var(--txt-dim);font-size:13px;font-family:'DM Sans',sans-serif;
  cursor:pointer;margin-top:6px;transition:border-color .15s,color .15s;
}
.btn-attach:active{border-color:var(--gold);color:var(--gold);}

.empty-state i{font-size:40px;}
.empty-state p{font-size:13px;}
.fab{position:fixed;right:16px;bottom:calc(64px + env(safe-area-inset-bottom,0) + 12px);
  width:52px;height:52px;border-radius:50%;background:var(--accent);color:#111;border:none;
  font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(245,184,0,.4);z-index:100;}
.fab:active{transform:scale(.92);}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;}
.modal-ov.open{display:flex;}
.modal-sheet{background:var(--surface);border-radius:18px 18px 0 0;width:100%;
  max-height:92dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0);}
.modal-drag{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
.modal-hd{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;gap:10px;}
.modal-hd-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;flex:1;}
.modal-body{overflow-y:auto;padding:14px 16px;flex:1;}
.mfield{margin-bottom:14px;}
.mfield label{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-dim);margin-bottom:5px;}
.mfield input,.mfield select,.mfield textarea{width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:9px;color:var(--txt);font-size:14px;padding:10px 12px;outline:none;
  font-family:'DM Sans',sans-serif;-webkit-appearance:none;}
.mfield input:focus,.mfield select:focus,.mfield textarea:focus{border-color:var(--accent);}
.mfield textarea{resize:none;height:80px;}
.modal-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;}
.btn-cancel{flex:1;background:transparent;border:1px solid var(--border);border-radius:10px;
  color:var(--txt-dim);padding:12px;font-size:14px;font-family:'DM Sans',sans-serif;cursor:pointer;}
.btn-save{flex:2;background:var(--accent);border:none;border-radius:10px;color:#111;
  padding:12px;font-size:14px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;}
.btn-save:disabled{opacity:.5;}
.btn-del{background:var(--red);border:none;border-radius:10px;color:#fff;
  padding:12px 16px;font-size:14px;font-family:'DM Sans',sans-serif;cursor:pointer;}
.loader{display:flex;align-items:center;justify-content:center;height:200px;}
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

var ABAS_CONFIG  = [{"key": "kanban_pin", "aba": "PINHEIRO", "pfx": "P", "label": "Pinheiro", "color": "#F97316"}, {"key": "kanban_inf", "aba": "INFRA", "pfx": "S", "label": "Infra", "color": "#14B8A6"}, {"key": "kanban_bar", "aba": "BARRETO'S", "pfx": "B", "label": "Barreto's", "color": "#F5B800"}, {"key": "kanban_gon", "aba": "GONCALVES", "pfx": "G", "label": "Gonçalves", "color": "#3B82F6"}];

// Mapeamento: campo padrão interno do mobile → nome real da coluna na planilha

    "DT CODIGO":               "Chave",
    "FRETE CLIENTE":           "FRETE CLIENTE",
    "FRETE MOTORISTA":         "FRETE MOTORISTA",
    "CUSTO TOTAL OPERACIONAL": "CUSTO TOTAL OPERACIONAL",
    "PREVISAO DA ENTREGA":     "PREVISÃO DA ENTREGA"
  },
  "BARRETO'S": {
    "DT CODIGO":               "Chave",
    "FRETE CLIENTE":           "FRETE COBRADO",
    "FRETE MOTORISTA":         "FRETE PAGO",

// Converte nome de coluna da planilha → chave padrão do mobile (inverso do mapa)
function colPlanilhaParaPadrao(nomeAba, colPlanilha) {
  var mapa = MAPA_COLUNAS_ABA[nomeAba] || {};
  for (var padrao in mapa) {
    if (mapa[padrao] === colPlanilha) return padrao;
  }
  return colPlanilha; // sem mapeamento = nome já é o padrão
}

// Converte chave padrão do mobile → nome de coluna real na planilha
function colPadraoParaPlanilha(nomeAba, chavePadrao) {
  var mapa = MAPA_COLUNAS_ABA[nomeAba] || {};
  return mapa[chavePadrao] || chavePadrao;
}
var COLUNAS_STATUS = ["OPERACIONAL", "COLETA", "AGUARDANDO MANIFESTO", "FATURADO", "MANIFESTOS", "FINALIZADO"];
var CAMPOS_CARD  = [

  {"key": "CIDADE ORIGEM",           "label": "Cidade Origem",                "type": "text",       "section": "Rota"},

document.addEventListener('DOMContentLoaded', function() {
  var raw = sessionStorage.getItem('barretos_user') || localStorage.getItem('barretos_user');
  if (!raw) { window.location.href = 'mobile_login.html'; return; }
  try { user = JSON.parse(raw); } catch(e) { window.location.href = 'mobile_login.html'; return; }
  document.getElementById('top-user').textContent = (user.nome||'').split(' ')[0].toUpperCase();
  initPullToRefresh();
  fetchPermissoes();
});

/* ── Pull to Refresh ── */
function initPullToRefresh() {
  var content  = document.getElementById('content');
  var ptr      = document.getElementById('ptr-indicator');
  var arrow    = document.getElementById('ptr-arrow');
  var lbl      = document.getElementById('ptr-label');
  var startY   = 0, pulling = false, triggered = false;
  var THRESHOLD = 70;

  content.addEventListener('touchstart', function(e) {
    // Só ativa se estiver no topo da área de cards
    var area = document.getElementById('cards-area');
    if (area && area.scrollTop > 0) return;
    startY   = e.touches[0].clientY;
    pulling  = true;
    triggered = false;
  }, {passive: true});

  content.addEventListener('touchmove', function(e) {
    if (!pulling) return;
    var dy = e.touches[0].clientY - startY;
    if (dy <= 0) { ptr.classList.remove('visible'); return; }
    ptr.classList.add('visible');
    if (dy >= THRESHOLD && !triggered) {
      arrow.className = 'ptr-arrow ti ti-arrow-down ready';
      lbl.textContent = 'Solte para atualizar';
    } else if (dy < THRESHOLD) {
      arrow.className = 'ptr-arrow ti ti-arrow-down';
      lbl.textContent = 'Puxe para atualizar';
    }
  }, {passive: true});

  content.addEventListener('touchend', function(e) {
    if (!pulling) return;
    pulling = false;
    var dy = e.changedTouches[0].clientY - startY;
    if (dy >= THRESHOLD && currentTab) {
      // Mostra spinner e recarrega
      arrow.style.display = 'none';
      lbl.innerHTML = '<span class="spinner"></span> Atualizando…';
      renderKanban(currentTab).then(function() {
        ptr.classList.remove('visible');
        arrow.style.display = '';
        lbl.textContent = 'Puxe para atualizar';
        arrow.className = 'ptr-arrow ti ti-arrow-down';
      });
    } else {
      ptr.classList.remove('visible');
    }
  }, {passive: true});
}

/* ── Anexos ── */
function onFilesSelected(files) {
  // Resolve a chave real: card em edição OU DT CODIGO digitado no formulário
  var chave = '';
  if (editCard && editCard.card['DT CODIGO']) {
    chave = editCard.card['DT CODIGO'];
  } else {
    var dtEl = document.getElementById('cf-DT CODIGO');
    chave = dtEl ? dtEl.value.trim().toUpperCase() : '';
  }
  if (!chave) {
    alert('⚠ Preencha o DT CODIGO antes de anexar arquivos.');
    document.getElementById('file-input').value = '';
    return;
  }

  var btn = document.querySelector('.btn-attach');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:middle"></span> Enviando...'; }
  var total = files.length, done = 0;
  for (var i = 0; i < files.length; i++) {
    (function(file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var base64 = e.target.result.split(',')[1];
        fetch(URL_KANBANS, {
          method: 'POST',
          body: JSON.stringify({
            action: 'upload_anexo',
            chave: chave,
            nome: file.name,
            data: base64,
            mimeType: file.type || 'application/octet-stream'
          })
        })
        .then(function(r) { return r.json(); })
        .then(function(j) {
          if (j.success) cardAttachments.push(j.anexo);
          done++;
          if (done === total) {
            renderAttachments();
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-paperclip" style="font-size:16px"></i> Anexar documento'; }
          }
        })
        .catch(function() {
          done++;
          if (done === total) {
            renderAttachments();
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-paperclip" style="font-size:16px"></i> Anexar documento'; }
          }
        });
      };
      reader.readAsDataURL(file);
    })(files[i]);
  }
  document.getElementById('file-input').value = '';
}

function carregarAnexos(chave) {
  if (!chave) return;
  fetch(URL_KANBANS + '?action=anexos&chave=' + encodeURIComponent(chave))
    .then(function(r) { return r.json(); })
    .then(function(j) {
      if (j.success) {
        cardAttachments = j.anexos || [];
        renderAttachments();
      }
    })
    .catch(function() {});
}

function renderAttachments() {
  var container = document.getElementById('attach-container');
  if (!container) return;
  container.innerHTML = '';

    var list = document.createElement('div'); list.className = 'attach-list';
    cardAttachments.forEach(function(a, idx) {
      var row = document.createElement('div'); row.className = 'attach-item';
      var icon = fileIcon(a.nome || a.name || '');
      var nome = escHtml(a.nome || a.name || 'arquivo');
      var size = a.size ? formatBytes(a.size) : '';
      var url = a.url || '';
      row.innerHTML =
        '<a href="' + url + '" target="_blank" style="display:flex;align-items:center;gap:10px;flex:1;text-decoration:none;color:inherit;">' +
        '<i class="ti ti-' + icon + ' attach-icon"></i>' +
        '<span class="attach-name">' + nome + '</span>' +
        (size ? '<span class="attach-size">' + size + '</span>' : '') +

        '<button class="attach-del" onclick="removeAttach(' + idx + ')" title="Remover">' +
        '<i class="ti ti-x"></i></button>';
      list.appendChild(row);
    });

  }

  btn.className = 'btn-attach';
  btn.type = 'button';

}

function removeAttach(idx) {
  var anexo = cardAttachments[idx];
  if (anexo && anexo.id) {
    fetch(URL_KANBANS, {
      method: 'POST',
      body: JSON.stringify({ action: 'excluir_anexo', fileId: anexo.id })
    }).catch(function() {});
  }
  cardAttachments.splice(idx, 1);
  renderAttachments();
}

function fileIcon(name) {
  var ext = (name.split('.').pop() || '').toLowerCase();
  if (['pdf'].includes(ext)) return 'file-type-pdf';
  if (['jpg','jpeg','png','gif','webp'].includes(ext)) return 'photo';
  if (['doc','docx'].includes(ext)) return 'file-type-doc';
  if (['xls','xlsx','csv'].includes(ext)) return 'file-spreadsheet';
  if (['zip','rar','7z'].includes(ext)) return 'file-zip';
  return 'file';
}

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}

function gerarProximoCodigo(tabKey) {
  var aba  = ABAS_CONFIG.find(function(a) { return a.key === tabKey; });
  var pfx  = aba ? aba.pfx : 'X';
  var now  = new Date();
  var ano  = String(now.getFullYear()).slice(-2);       // "26"
  var mes  = String(now.getMonth() + 1);               // "6" (sem zero à esquerda)
  var prefixoMes = pfx + ano + mes;                    // ex: "S266"

  // Pega TODOS os cards de TODAS as abas carregadas para garantir unicidade global
  var todosCodigos = [];
  Object.keys(rawCards).forEach(function(k) {
    (rawCards[k] || []).forEach(function(c) {
      var cod = (c['DT CODIGO'] || '').toUpperCase().trim();
      if (cod) todosCodigos.push(cod);
    });
  });

  // Filtra apenas os que têm o prefixo do mês atual (ex: "S266")
  var numeros = todosCodigos
    .filter(function(cod) { return cod.startsWith(prefixoMes); })
    .map(function(cod) {
      var seq = parseInt(cod.slice(prefixoMes.length), 10);
      return isNaN(seq) ? 0 : seq;
    });

  var proximo = numeros.length > 0 ? Math.max.apply(null, numeros) + 1 : 1;
  var candidato = prefixoMes + String(proximo).padStart(2, '0');

  // Garante que o candidato não existe em nenhuma aba (evita colisão)
  while (todosCodigos.indexOf(candidato) !== -1) {
    proximo++;
    candidato = prefixoMes + String(proximo).padStart(2, '0');
  }

  return candidato;
}

function verificarDuplicidade(codigo, codigoOriginal) {
  var alert = document.getElementById('dt-alert');
  var input = document.getElementById('cf-DT CODIGO');
  if (!alert || !input) return;
  if (!codigo || codigo === codigoOriginal) {
    alert.style.display = 'none';
    input.style.borderColor = '';
    return;
  }
  // Verifica em todos os kanbans carregados
  var existe = false;
  Object.keys(rawCards).forEach(function(k) {
    (rawCards[k] || []).forEach(function(c) {
      if ((c['DT CODIGO']||'').toUpperCase() === codigo.toUpperCase()) existe = true;
    });
  });
  if (existe) {
    alert.style.display = 'flex';
    input.style.borderColor = '#EF4444';
  } else {
    alert.style.display = 'none';
    input.style.borderColor = 'var(--green)';
  }
}

  if (!codigoAtual && !editCard) {
    codigoAtual = gerarProximoCodigo(currentTab);

  var dtInput = document.createElement('input');

  dtInput.id = 'cf-DT CODIGO';
  dtInput.value = codigoAtual;
  dtInput.setAttribute('autocomplete','off');

  // Alerta de duplicidade (só visível ao criar)
  var dtAlert = document.createElement('div');
  dtAlert.id = 'dt-alert';
  dtAlert.style.cssText = 'margin-top:5px;font-size:11px;font-weight:700;color:#EF4444;align-items:center;gap:5px;';
  dtAlert.style.display = 'none';
  dtAlert.innerHTML = '<i class="ti ti-alert-triangle" style="font-size:13px"></i> CÓDIGO JÁ USADO — altere antes de salvar';

  if (editCard) {
    // Edição: código não pode ser alterado

    dtInput.style.cssText = 'font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-size:15px;opacity:.7;cursor:not-allowed;';
  } else {
    // Criação: editável com validação de duplicidade
    dtInput.style.cssText = 'font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-size:15px;';
    dtInput.addEventListener('input', function() {
      this.value = this.value.toUpperCase();
      verificarDuplicidade(this.value, '');
    });
  }

  dtDiv.appendChild(dtInput);
  dtDiv.appendChild(dtAlert);
  body.appendChild(dtDiv);

  // Ao criar: verifica se código gerado já existe
  if (!editCard) {
    verificarDuplicidade(codigoAtual, '');
  }


  // ── Demais campos agrupados por seção ──
  var currentSection = '';
  CAMPOS_CARD.forEach(function(f) {
    // Separador de seção
    if (f.section && f.section !== currentSection) {

      var sep = document.createElement('div');

        + '<span style="flex:1;height:1px;background:var(--border);margin-left:4px"></span>';

    }

    var div = document.createElement('div'); div.className = 'mfield';

    div.appendChild(lbl);
    var inp;

    if (f.type === 'select') {
      inp = document.createElement('select'); inp.id = 'cf-' + f.key;
      COLUNAS_STATUS.forEach(function(o) {
        var opt = document.createElement('option'); opt.value = o; opt.textContent = o;
        if ((data[f.key]||COLUNAS_STATUS[0]) === o) opt.selected = true;
        inp.appendChild(opt);
      });
    } else if (f.type === 'select-pix') {
      inp = document.createElement('select'); inp.id = 'cf-' + f.key;
      ['','CPF','CNPJ','Telefone','E-mail','Chave aleatória'].forEach(function(o) {
        var opt = document.createElement('option'); opt.value = o; opt.textContent = o || '— selecione —';
        if ((data[f.key]||'') === o) opt.selected = true;
        inp.appendChild(opt);
      });
    } else if (f.type === 'percent') {
      var pw = document.createElement('div');
      pw.style.cssText = 'display:flex;align-items:center;gap:6px;';
      inp = document.createElement('input'); inp.type = 'text';
      inp.id = 'cf-' + f.key; inp.value = data[f.key]||'';
      inp.style.flex = '1';
      inp.placeholder = '0';
      inp.oninput = function() { this.value = this.value.replace(/[^0-9.,]/g,''); };
      var pct = document.createElement('span');
      pct.textContent = '%';
      pct.style.cssText = 'font-size:14px;font-weight:700;color:var(--gold);flex-shrink:0;';
      pw.appendChild(inp); pw.appendChild(pct);
      div.appendChild(lbl); div.appendChild(pw); body.appendChild(div);

    }
    div.appendChild(inp); body.appendChild(div);

  // ── Seção Anexos ──

  attachDiv.id = 'attach-container';
  body.appendChild(attachDiv);

async function salvarCard() {
  // Bloqueia duplicidade APENAS ao criar card novo (não ao editar)
  if (!editCard) {
    var dtAlert = document.getElementById('dt-alert');
    if (dtAlert && dtAlert.style.display === 'flex') {
      alert('⚠ CÓDIGO JÁ USADO — altere o DT CODIGO antes de salvar.');
      return;
    }
  }

  var btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:4px"></span>Salvando…';

  // Monta objeto de dados: DT CODIGO + todos os campos do card
  var dados = {};

  // DT CODIGO — vem do input editável
  var dtEl = document.getElementById('cf-DT CODIGO');
  if (dtEl) dados['DT CODIGO'] = dtEl.value.trim().toUpperCase();

  // Demais campos (CAMPOS_CARD não inclui DT CODIGO, então sem duplicata)
  CAMPOS_CARD.forEach(function(f) {
    var el = document.getElementById('cf-' + f.key);
    if (el) dados[f.key] = el.value;
  });

  // Campos padrão internos do mobile — o mapa traduz para o nome real de cada aba
  var CAMPOS_PADRAO = [
    "DT CODIGO","Resumo","Status","Responsável","VENDEDOR","CNPJ TOMADOR","CLIENTE",
    "CONTATO CLIENTE","ACOMPANHAMENTO","CTE","NF","DATA DA COLETA",
    "PREVISAO DA ENTREGA","CIDADE ORIGEM","UF ORIGEM","CIDADE DESTINO",
    "UF DESTINO","FRETE CLIENTE","FRETE MOTORISTA","CUSTO TOTAL OPERACIONAL",
    "ADIANTAMENTO","TIPO DE VEICULO","MOTORISTA","TELEFONE MOTORISTA",
    "GERENCIAMENTO","DATA DA ENTREGA","TITULAR DA CONTA","TIPO CHAVE PIX",
    "CHAVE PIX","BANCO","OBSERVACAO","TITULO"
  ];

  var aba = ABAS_CONFIG.find(function(a) { return a.key === currentTab; });

  // Traduz chaves padrão → nomes reais das colunas desta aba
  var dadosTraduzidos = {};
  CAMPOS_PADRAO.forEach(function(chavePadrao) {
    if (dados[chavePadrao] === undefined) return;
    var colReal = colPadraoParaPlanilha(aba.aba, chavePadrao);
    dadosTraduzidos[colReal] = dados[chavePadrao];
  });

  var payload = editCard
    ? {action:'update', aba:aba.aba, chave:editCard.card['DT CODIGO'], dados:dadosTraduzidos}
    : {action:'create', aba:aba.aba, dados:dadosTraduzidos};

  console.log('[salvarCard] payload:', JSON.stringify(payload));

  try {
    var r = await fetch(URL_KANBANS, {method:'POST', body:JSON.stringify(payload)});
    var j = await r.json();
    console.log('[salvarCard] resposta:', JSON.stringify(j));
    if (j.success) { fecharModal(); await renderKanban(currentTab); }
    else alert('Erro: ' + (j.error||'desconhecido'));
  } catch(e) { alert('Erro de conexão: ' + e.message); }

  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-device-floppy" style="font-size:13px"></i> Salvar';
}

async function excluirCard() {
  if (!editCard || !confirm('Excluir este card?')) return;
  var aba = ABAS_CONFIG.find(function(a) { return a.key === editCard.key; });
  // A chave enviada deve ser o VALOR do DT CODIGO (não o nome da coluna)
  // O Apps Script busca pelo valor na coluna "Chave" ou "DT CODIGO"
  var chaveValor = editCard.card['DT CODIGO'];
  try {
    var r = await fetch(URL_KANBANS, {method:'POST',
      body:JSON.stringify({action:'delete', aba:aba.aba, chave:chaveValor})});
    var j = await r.json();
    if (j.success) { fecharModal(); await renderKanban(currentTab); }
    else alert('Erro: ' + j.error);
  } catch(e) { alert('Erro de conexão.'); }
}

function logout() {
  if (!confirm('Encerrar sessão?')) return;
  ['barretos_user','barretos_nome','barretos_perfil','barretos_login'].forEach(function(k) {
    sessionStorage.removeItem(k); localStorage.removeItem(k);
  });
  window.location.href = 'mobile_login.html';
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
